name: GA4 Recon (measurement IDs)
on:
  workflow_dispatch: {}
jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: E-mail da service account (para conceder Leitor no GA4)
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: echo "SA_EMAIL=$(node -e 'console.log(JSON.parse(process.env.GOOGLE_SERVICE_ACCOUNT_JSON).client_email)')"
