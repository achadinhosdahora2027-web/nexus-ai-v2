name: CF Token Audit (21.21)
on:
  workflow_dispatch: {}
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Recon CF Pages + Workers
        env:
          CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ZONES: ${{ secrets.CLOUDFLARE_ZONE_IDS }}
          ACC: 6f0b265228c514158b20be2e5ea3ec96
        run: |
          echo "=== PAGES PROJECTS ==="
          curl -s -m 20 -H "Authorization: Bearer $CF" "https://api.cloudflare.com/client/v4/accounts/$ACC/pages/projects" | python3 -c "
import json,sys
d=json.load(sys.stdin)
for p in d.get('result') or []:
    print(' projeto:', p.get('name'), '| domains:', p.get('domains'), '| prod:', p.get('production_domain'))
    src=p.get('source') or {}
    try: print('   source:', (src.get('repository') or {}).get('name'), '| branch:', p.get('production_branch'))
    except: print('   source: direct-upload')"
          echo "=== AQUITEM DETALHE ==="
          curl -s -m 20 -H "Authorization: Bearer $CF" "https://api.cloudflare.com/client/v4/accounts/$ACC/pages/projects/aquitem" | python3 -c "
import json,sys
d=json.load(sys.stdin).get('result') or {}
print(' domains:', d.get('domains'))
print(' source:', json.dumps(d.get('source'))[:250])
print(' build:', json.dumps(d.get('build_config'))[:150])"
          echo "=== SOLVEGRID DETALHE ==="
          curl -s -m 20 -H "Authorization: Bearer $CF" "https://api.cloudflare.com/client/v4/accounts/$ACC/pages/projects" | python3 -c "
import json,sys
d=json.load(sys.stdin)
for p in d.get('result') or []:
    if 'solve' in (p.get('name') or '').lower():
        print(' projeto:', p.get('name'), '| domains:', p.get('domains'))
        print(' source:', json.dumps(p.get('source'))[:250])"
          echo "=== WORKERS ==="
          curl -s -m 20 -H "Authorization: Bearer $CF" "https://api.cloudflare.com/client/v4/accounts/$ACC/workers/scripts" | python3 -c "
import json,sys
d=json.load(sys.stdin)
for s in d.get('result') or []: print(' worker:', s.get('id'))"
          for Z in $(echo $ZONES | tr ',' ' '); do
            echo "=== WORKER ROUTES zona $Z ==="
            curl -s -m 20 -H "Authorization: Bearer $CF" "https://api.cloudflare.com/client/v4/zones/$Z/workers/routes" | python3 -c "
import json,sys
d=json.load(sys.stdin)
for r in d.get('result') or []: print(' rota:', r.get('pattern'), '->', r.get('script'))"
          done
