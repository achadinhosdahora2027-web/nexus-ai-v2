# ============================================================================
# NEXUS GROWTH ENGINE — Cron de indexação acelerada + social outbox
# - google-indexation: a cada 4h (sitemap incremental + URL Inspection com
#   quota 200/dia/domínio; 429/403 fail-closed → fila pending_google_crawl)
# - ayrshare-outbox: a cada 6h (high_priority_post primeiro; sem key devolve
#   o lote à fila sem falhar)
# Self-contained: não depende do package.json do repo.
# Credenciais EXCLUSIVAMENTE de GitHub Secrets.
# ============================================================================
name: nexus-growth-cron

on:
  schedule:
    - cron: "0 */4 * * *"   # engine Google (janela 4h)
    - cron: "30 */6 * * *"  # robô Ayrshare (janela 6h)
    - cron: "0 6 * * 1"     # higiene de URLs da fila (segundas 06:00 UTC)
    - cron: "5 */4 * * *"   # clima Open-Meteo (10min antes do cluster matrix)
    - cron: "15 */4 * * *"  # matrix agent cluster (4h, defasado 15min do Google)
    - cron: "45 */4 * * *"  # malha global de indexação (100+ endpoints)
    - cron: "25 */4 * * *"   # expurgo Cloudflare pós-matrix (vitrines frescas)
    - cron: "20 8 * * *"     # oráculo C3 — pílula diária 05:20 Brasília (21.38)
  workflow_dispatch:
    inputs:
      job:
        description: "Qual engine rodar"
        type: choice
        default: google
        options: [google, social, both, hygiene, matrix, weather, mesh, purge, oraculo]

concurrency:
  group: nexus-growth-cron
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  google-indexation:
    name: Google Search Console (sitemap + URL Inspection)
    runs-on: ubuntu-latest
    timeout-minutes: 18
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '0 */4 * * *')
      || (github.event_name == 'workflow_dispatch'
      && (inputs.job == 'google' || inputs.job == 'both'))
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Runtime do engine (isolado do package.json)
        run: npm install --no-save google-auth-library@^9.14.0 tsx@^4.15.0
      - name: Executar engine de indexação Google
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          NEXUS_GROWTH_DB_URL: ${{ secrets.NEXUS_GROWTH_DB_URL }}
          NEXUS_GROWTH_DB_SERVICE_KEY: ${{ secrets.NEXUS_GROWTH_DB_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COMMERCE_TELEGRAM_HOSTS: api.telegram.org
          NEXUS_MAX_URLS_PER_HOST: "200"
          NEXUS_CLAIM_LIMIT: "200"
          NEXUS_TIME_BUDGET_MS: "660000"   # 11 min — excedente volta à fila
          NEXUS_INSPECT_CONCURRENCY: "4"   # ~120/min (limites: 600/min global)
          NEXUS_HUB_URLS: >-
            https://solvegrid.com.br,https://www.solvegrid.com.br,
            https://aquitemachadinhos.com.br,https://www.aquitemachadinhos.com.br,
            https://nexusplataforma.ia.br,https://www.nexusplataforma.ia.br
        run: npx tsx src/server/scheduler/run-google-indexation.ts

  ayrshare-outbox:
    name: Ayrshare Outbox (Instagram / Pinterest / TikTok)
    runs-on: ubuntu-latest
    timeout-minutes: 18
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '30 */6 * * *')
      || (github.event_name == 'workflow_dispatch'
      && (inputs.job == 'social' || inputs.job == 'both'))
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Runtime do engine (isolado do package.json)
        run: npm install --no-save tsx@^4.15.0
      - name: Consumir fila social (payload oficial primary)
        env:
          AYRSHARE_API_KEY: ${{ secrets.AYRSHARE_API_KEY }}
          NEXUS_GROWTH_DB_URL: ${{ secrets.NEXUS_GROWTH_DB_URL }}
          NEXUS_GROWTH_DB_SERVICE_KEY: ${{ secrets.NEXUS_GROWTH_DB_SERVICE_KEY }}
          AYRSHARE_BATCH: 3
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COMMERCE_TELEGRAM_HOSTS: api.telegram.org
        run: npx tsx src/server/scheduler/ayrshare-outbox-worker.ts

  url-hygiene:
    name: URL Hygiene (auditoria viva da fila de indexação)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '0 6 * * 1')
      || (github.event_name == 'workflow_dispatch' && inputs.job == 'hygiene')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Runtime do engine
        run: npm install --no-save tsx@^4.15.0
      - name: Auditar URLs vivas da fila (GET real, canonical, redirects)
        env:
          NEXUS_GROWTH_DB_URL: ${{ secrets.NEXUS_GROWTH_DB_URL }}
          NEXUS_GROWTH_DB_SERVICE_KEY: ${{ secrets.NEXUS_GROWTH_DB_SERVICE_KEY }}
          HYGIENE_CONCURRENCY: "16"
        run: npx tsx src/server/scheduler/queue-url-hygiene.ts

  # ==========================================================================
  # MATRIX AGENT CLUSTER — orquestrador central em Edge Function Supabase
  # (supabase/functions/nexus-matrix-orchester). 216 agentes especialistas em
  # public.nexus_agents; execuções agendadas em nexus_agent_tasks_queue.
  # Fail-closed ponta a ponta: sem NEXUS_MATRIX_SECRET → warning + skip;
  # falha de agente individual → telemetria + próxima tarefa (nunca trava
  # anúncios, rotas SolveGrid, Google engine ou Ayrshare).
  # ==========================================================================
  matrix-agents:
    name: Matrix Agent Cluster (Edge Function orquestradora)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '15 */4 * * *')
      || (github.event_name == 'workflow_dispatch' && inputs.job == 'matrix')
    steps:
      - name: Despachar lote do cluster (fail-closed)
        env:
          NEXUS_MATRIX_SECRET: ${{ secrets.NEXUS_MATRIX_SECRET }}
          MATRIX_ENDPOINT: https://etbxbaaaspdcoiakifbb.supabase.co/functions/v1/nexus-matrix-orchester
          MATRIX_BATCH: "8"
        run: |
          if [ -z "$NEXUS_MATRIX_SECRET" ]; then
            echo "::warning::NEXUS_MATRIX_SECRET ausente — cluster em fail-closed (nenhum agente despachado)"
            exit 0
          fi
          CODE=$(curl -sS -o /tmp/matrix.json -w '%{http_code}' --max-time 540 \
            -X POST "$MATRIX_ENDPOINT?batch=$MATRIX_BATCH" \
            -H "x-matrix-secret: $NEXUS_MATRIX_SECRET" \
            -H "content-type: application/json" -d '{}' || echo "000")
          echo "HTTP $CODE"; cat /tmp/matrix.json 2>/dev/null || true; echo
          case "$CODE" in
            200) echo "✔ lote concluído"; exit 0;;
            000) echo "::warning::timeout de rede — tarefas voltam por reentrega (SKIP LOCKED)"; exit 0;;
            *)   echo "::error::orquestrador respondeu $CODE"; exit 1;;
          esac

  # ==========================================================================
  # ORÁCULO C3 (21.38) — pílula diária de utilidade pública no Telegram
  # (@achadinhosdahora2026vip): cotação er-api + clima Open-Meteo + dica de
  # viagem redigida por elo gratuito, com mídia HD. Edge v5.8 ?oraculo=1.
  # Fail-closed: falha da rota NUNCA afeta os demais engines.
  # ==========================================================================
  telegram-oraculo:
    name: Oráculo C3 (pílula diária Telegram)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == 'cron: 20 8 * * *')
      || (github.event_name == 'workflow_dispatch' && inputs.job == 'oraculo')
    steps:
      - name: Despachar pílula do Oráculo (fail-closed)
        env:
          NEXUS_MATRIX_SECRET: ${{ secrets.NEXUS_MATRIX_SECRET }}
          MATRIX_ENDPOINT: https://etbxbaaaspdcoiakifbb.supabase.co/functions/v1/nexus-matrix-orchester
        run: |
          if [ -z "$NEXUS_MATRIX_SECRET" ]; then
            echo "::warning::NEXUS_MATRIX_SECRET ausente — oráculo em fail-closed"
            exit 0
          fi
          CODE=$(curl -sS -o /tmp/oraculo.json -w '%{http_code}' --max-time 420 \
            -X POST "$MATRIX_ENDPOINT?oraculo=1" \
            -H "x-matrix-secret: $NEXUS_MATRIX_SECRET" \
            -H "content-type: application/json" -d '{}' || echo "000")
          echo "HTTP $CODE"; cat /tmp/oraculo.json 2>/dev/null || true; echo
          case "$CODE" in
            200) echo "oráculo concluído"; exit 0;;
            000) echo "::warning::timeout — oráculo tenta de novo amanhã (cron)"; exit 0;;
            *)   echo "::error::orquestrador respondeu $CODE"; exit 1;;
          esac

  # ==========================================================================
  # WEATHER CONTEXT — Open-Meteo via SDK oficial `openmeteo` (keyless).
  # Snapshots em public.nexus_weather_snapshots; o orquestrador matrix lê o
  # mais recente por cidade (read-only) e injeta `clima` no contexto dos 223
  # agentes. Roda 10 min ANTES do matrix para contexto fresco. Fail-closed.
  # ==========================================================================
  weather-context:
    name: Weather Context (Open-Meteo → snapshots)
    runs-on: ubuntu-latest
    timeout-minutes: 6
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '5 */4 * * *')
      || (github.event_name == 'workflow_dispatch' && inputs.job == 'weather')
    steps:
      - name: Coletar clima (fail-closed)
        env:
          NEXUS_MATRIX_SECRET: ${{ secrets.NEXUS_MATRIX_SECRET }}
          WEATHER_ENDPOINT: https://etbxbaaaspdcoiakifbb.supabase.co/functions/v1/nexus-weather-context
        run: |
          if [ -z "$NEXUS_MATRIX_SECRET" ]; then
            echo "::warning::NEXUS_MATRIX_SECRET ausente — weather em fail-closed (skip)"
            exit 0
          fi
          CODE=$(curl -sS -o /tmp/weather.json -w '%{http_code}' --max-time 300 \
            -X POST "$WEATHER_ENDPOINT" \
            -H "x-matrix-secret: $NEXUS_MATRIX_SECRET" \
            -H "content-type: application/json" -d '{}' || echo "000")
          echo "HTTP $CODE"; cat /tmp/weather.json 2>/dev/null || true; echo
          case "$CODE" in
            200) echo "✔ snapshots atualizados"; exit 0;;
            000) echo "::warning::timeout de rede — próximo ciclo refaz"; exit 0;;
            *)   echo "::error::weather respondeu $CODE"; exit 1;;
          esac

  # ==========================================================================
  # GLOBAL INDEXATION MESH — 100+ endpoints de submissão/sindicação no-auth:
  # IndexNow ×6 (api/bing/yandex/naver/seznam/qwant, chave do cofre em
  # nexus_growth_secrets) + pings XML-RPC ×21 + agregadores sitemap/RSS ×40.
  # Claim atômico SKIP LOCKED (≤100 URLs/run). Concorrência 5. O engine
  # Google (job acima) segue dono único do GSC e da quota 200/dia/host.
  # Fail-closed: falha por endpoint → telemetria + próximo; cron nunca quebra.
  # ==========================================================================
  global-indexation-mesh:
    name: Global Indexation Mesh (IndexNow + XML-RPC + Agregadores)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '45 */4 * * *')
      || (github.event_name == 'workflow_dispatch' && inputs.job == 'mesh')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Runtime do mesh (isolado do package.json)
        run: npm install --no-save tsx@^4.15.0
      - name: Disparar malha multi-engines (fail-closed)
        env:
          NEXUS_GROWTH_DB_URL: ${{ secrets.NEXUS_GROWTH_DB_URL }}
          NEXUS_GROWTH_DB_SERVICE_KEY: ${{ secrets.NEXUS_GROWTH_DB_SERVICE_KEY }}
        run: npx tsx src/server/scheduler/global-indexation-mesh.ts

  # ==========================================================================
  # CLOUDFLARE CACHE PURGER — pacote cf-www-unblock/. Expurga o cache de borda
  # das 3 vitrines espelho sempre que a matriz recalcula os melhores anúncios
  # (10 min após o Matrix Agent Cluster; MV de ofertas refresca 06:30 UTC).
  # purge_everything por zona via api.cloudflare.com. Fail-closed total:
  # 429/5xx/rede → telemetria nexus_cron_telemetry + skip; nunca quebra o cron
  # nem toca os 14.036 anúncios (operação exclusivamente de borda).
  # ==========================================================================
  cloudflare-purge:
    name: Cloudflare Cache Purge (vitrines espelho)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '25 */4 * * *')
      || (github.event_name == 'workflow_dispatch' && inputs.job == 'purge')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Runtime do purger (isolado do package.json)
        run: npm install --no-save tsx@^4.15.0
      - name: Expurgar cache das vitrines (fail-closed)
        env:
          NEXUS_GROWTH_DB_URL: ${{ secrets.NEXUS_GROWTH_DB_URL }}
          NEXUS_GROWTH_DB_SERVICE_KEY: ${{ secrets.NEXUS_GROWTH_DB_SERVICE_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_IDS: ${{ secrets.CLOUDFLARE_ZONE_IDS }}
        run: npx tsx src/server/scheduler/cloudflare-cache-purger.ts
