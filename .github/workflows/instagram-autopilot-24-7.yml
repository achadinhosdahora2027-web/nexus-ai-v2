name: Instagram AI Autonomous Autopilot 24/7 (Feed, Reels & ManyChat)

on:
  schedule:
    - cron: "0 12,17,23 * * *"
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  instagram-autopilot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate AI Visual Cards & Viral Captions
        run: |
          node scripts/instagram-auto-creator.js || true

      - name: Publish & Dispatch to Instagram API & Feeds
        run: |
          node scripts/instagram-meta-graph-publisher.js || true
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          UPLOAD_POST_API_KEY: ${{ secrets.UPLOAD_POST_API_KEY }}
          MANYCHAT_API_TOKEN: ${{ secrets.MANYCHAT_API_TOKEN }}
