name: Instagram AI Autonomous Autopilot 24/7 (Multi-Language & Comments AI)

on:
  schedule:
    - cron: "0 12,17,23 * * *"
  push:
    branches:
      - main
  workflow_dispatch:

env:
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  TELEGRAM_DEALS_CHANNEL: ${{ secrets.TELEGRAM_DEALS_CHANNEL }}
  TWITTER_BEARER_TOKEN: ${{ secrets.TWITTER_BEARER_TOKEN }}
  TWITTER_CONSUMER_KEY: ${{ secrets.TWITTER_CONSUMER_KEY }}
  TWITTER_CONSUMER_SECRET: ${{ secrets.TWITTER_CONSUMER_SECRET }}
  TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
  TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
  META_APP_ID: ${{ secrets.META_APP_ID }}
  META_APP_SECRET_TOKEN: ${{ secrets.META_APP_SECRET_TOKEN }}
  META_MASTER_USER_TOKEN: ${{ secrets.META_MASTER_USER_TOKEN }}
  META_PAGE_TOKEN_A: ${{ secrets.META_PAGE_TOKEN_A }}
  META_PAGE_TOKEN_B: ${{ secrets.META_PAGE_TOKEN_B }}
  META_PAGE_TOKEN_2: ${{ secrets.META_PAGE_TOKEN_2 }}
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

jobs:
  instagram-autopilot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate AI National Visual Cards & Captions
        run: |
          node scripts/instagram-auto-creator.js || true

      - name: Generate AI Multi-Language Visual Cards (195 Countries)
        run: |
          node scripts/instagram-auto-creator-multilang.js || true

      - name: Auto-Respond to Comments with CJ/Affiliate Links
        run: |
          node scripts/instagram-comments-auto-responder.js || true

      - name: Publish & Dispatch to Meta Graph API & Feeds
        run: |
          node scripts/instagram-meta-graph-publisher.js || true
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          UPLOAD_POST_API_KEY: ${{ secrets.UPLOAD_POST_API_KEY }}
          MANYCHAT_API_TOKEN: ${{ secrets.MANYCHAT_API_TOKEN }}
