name: Backfill C1 chat privado (one-off 21.38)
on:
  workflow_dispatch: {}
jobs:
  c1:
    name: Descobrir chat privado e gravar no cofre
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: getChat + gravação no cofre (fail-closed)
        env:
          TOK: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          C1: ${{ secrets.TELEGRAM_CHAT_ID }}
          DBURL: ${{ secrets.NEXUS_GROWTH_DB_URL }}
          DBKEY: ${{ secrets.NEXUS_GROWTH_DB_SERVICE_KEY }}
        run: |
          set -e
          RESP=$(curl -s -m 20 "https://api.telegram.org/bot$TOK/getChat?chat_id=$C1")
          echo "getChat: $(echo "$RESP" | jq -c '{ok, type: .result.type, id: .result.id}')"
          echo "$RESP" | jq -e '.ok == true' > /dev/null
          ID=$(echo "$RESP" | jq -r '.result.id')
          TYPE=$(echo "$RESP" | jq -r '.result.type')
          echo "chat tipo=$TYPE id=$ID"
          # grava telegram_chat_id_privado (C1) e RESTAURA telegram_chat_id do
          # painel forense para o privado (C2 publico tem chave propria agora)
          for K in telegram_chat_id_privado telegram_chat_id; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' -X PATCH \
              "$DBURL/rest/v1/nexus_growth_secrets?key=eq.$K" \
              -H "apikey: $DBKEY" -H "Authorization: Bearer $DBKEY" \
              -H "Content-Type: application/json" -H "Prefer: return=minimal" \
              -d "{\"value\":\"$ID\",\"updated_at\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}")
            echo "$K -> HTTP $CODE"
          done
